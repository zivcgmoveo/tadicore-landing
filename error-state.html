<title>TadiCore – מצב שגיאת תקשורת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{margin:0}
/* TadiCore landing page – all rules are scoped under #tadicore-landing-page so they cannot affect the host site,
   and host styles (Bootstrap / theme) cannot override them. Custom properties live on the wrapper. */
#tadicore-landing-page{--blue-900:#00344a; --blue-800:#00577c; --blue-700:#0071a1; --blue-600:#2194be; --blue-500:#4ea9cb; --blue-400:#7abfd8; --blue-300:#a6d4e5; --blue-200:#d3eaf2; --blue-100:#eaf6fa; --ink:#0f171b; --ink-soft:#546069; --grey-600:#8b969b; --grey-300:#dbe3e6; --grey-200:#e8eef0; --grey-100:#f2f6f7; --white:#ffffff; --red:#d9363e; --green:#1a8f60; --brand:#2194be; --bg:#ffffff; --bg-soft:#f3f8fa; --bg-tint:#eaf6fa; --surface:#ffffff; --glass-bg:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.85); --hairline:rgba(15,23,27,.09); --hairline-strong:rgba(15,23,27,.16); --text:#0b1317; --text-soft:#47545d; --accent:#2194be; --accent-strong:#00577c; --accent-soft:#e6f4f9; --glow-rgb:33,148,190; --radius-sm:10px; --radius-md:18px; --radius-lg:28px; --radius-pill:999px; --font-body:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --font-mono:'IBM Plex Mono','Courier New',monospace; --container:1180px; --gutter:24px; --ease-out:cubic-bezier(.22,1,.36,1); color-scheme:light;}
#tadicore-landing-page *,
#tadicore-landing-page *::before,
#tadicore-landing-page *::after{box-sizing:border-box;}
#tadicore-landing-page{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.6; direction:rtl; -webkit-font-smoothing:antialiased; overflow-x:clip;}
#tadicore-landing-page img,
#tadicore-landing-page svg{max-width:100%;}
#tadicore-landing-page h1,
#tadicore-landing-page h2,
#tadicore-landing-page h3,
#tadicore-landing-page h4{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-0.02em;}
#tadicore-landing-page p{margin:0;}
#tadicore-landing-page a{color:inherit;}
#tadicore-landing-page button{font-family:inherit;}
#tadicore-landing-page :focus-visible{outline:2px solid var(--blue-600);outline-offset:3px;}
#tadicore-landing-page .hero :focus-visible{outline-color:#fff;}
#tadicore-landing-page section[id]{scroll-margin-top:84px;}
#tadicore-landing-page .container{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter);}
#tadicore-landing-page .section{padding-block:110px;position:relative;}
@media (max-width:720px){
  #tadicore-landing-page .section{padding-block:72px;}
}
#tadicore-landing-page .section-head{max-width:820px;margin-bottom:48px;}
#tadicore-landing-page h1 .em,
#tadicore-landing-page .scrub .em{font-style:normal;}
#tadicore-landing-page .section-head.center{max-width:none;text-align:center;}
#tadicore-landing-page .section-head h2{font-size:clamp(34px,5vw,60px);line-height:1.12;margin:0;background:linear-gradient(180deg,var(--text) 46%,#2d3d47);-webkit-background-clip:text;background-clip:text;color:transparent;}
#tadicore-landing-page .section-head p{margin-top:18px;font-size:18px;color:var(--text-soft);max-width:60ch;}
#tadicore-landing-page .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
#tadicore-landing-page .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
#tadicore-landing-page .skip-link{position:absolute;right:12px;top:-48px;background:var(--brand);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);z-index:200;transition:top .2s;}
#tadicore-landing-page .skip-link:focus{top:12px;}
#tadicore-landing-page .reveal{opacity:0;}
#tadicore-landing-page .reveal.is-visible{opacity:1;animation:tc-revealIn .6s var(--ease-out) var(--d,0s) backwards;}
@keyframes tc-revealIn{from{opacity:0;transform:translate(var(--rx,0px),var(--ry,32px)) scale(var(--rs,1));}}
@media (prefers-reduced-motion: reduce){
  #tadicore-landing-page *,
  #tadicore-landing-page *::before,
  #tadicore-landing-page *::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  #tadicore-landing-page .reveal{opacity:1;}
}
#tadicore-landing-page .scroll-progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:130;pointer-events:none; transform-origin:100% 50%;transform:scaleX(0); background:linear-gradient(270deg,var(--blue-300),var(--blue-600),var(--blue-800));}
#tadicore-landing-page .glass{background:var(--glass-bg); border:1px solid var(--glass-border); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 28px 56px -34px rgba(15,35,45,.28);}
#tadicore-landing-page .glow-hover{position:relative;isolation:isolate; transform:perspective(900px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)); transition:translate .45s var(--ease-out),transform .35s var(--ease-out),box-shadow .45s var(--ease-out),border-color .45s var(--ease-out);}
#tadicore-landing-page .glow-hover::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;opacity:0; background:radial-gradient(280px 190px at var(--mx,50%) var(--my,50%), rgba(33,148,190,.7), transparent 70%); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0); transition:opacity .45s ease;}
#tadicore-landing-page .glow-hover::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0; background:radial-gradient(340px 230px at var(--mx,50%) var(--my,50%), rgba(33,148,190,.1), transparent 70%); transition:opacity .45s ease;}
#tadicore-landing-page .glow-hover:hover{translate:0 -5px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 32px 64px -34px rgba(33,148,190,.38);}
#tadicore-landing-page .glow-hover:hover::before,
#tadicore-landing-page .glow-hover:hover::after{opacity:1;}
#tadicore-landing-page .glow-hover .icon-wrap{transition:transform .5s var(--ease-out),background .3s;}
#tadicore-landing-page .glow-hover:hover .icon-wrap{transform:translateY(-3px) rotate(-6deg) scale(1.08);}
#tadicore-landing-page .glow-hover:hover .icon-wrap{background:var(--blue-200);}
#tadicore-landing-page .glow-hover:hover .tag{background:var(--accent-soft);color:var(--accent-strong);border-color:rgba(33,148,190,.28);}
#tadicore-landing-page .tadiran-header{position:sticky;top:0;z-index:120;background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.1);height:72px;}
#tadicore-landing-page .th-inner{height:100%;max-width:1440px;margin-inline:auto;padding-inline:clamp(16px,3vw,40px);display:flex;align-items:center;gap:clamp(20px,2.6vw,40px);}
#tadicore-landing-page .th-logo{display:flex;align-items:center;flex:none;}
#tadicore-landing-page .th-logo img{display:block;width:29px;height:29px;}
#tadicore-landing-page .th-nav ul{display:flex;align-items:center;gap:clamp(14px,2vw,32px);list-style:none;margin:0;padding:0;}
#tadicore-landing-page .th-nav a{display:block;padding-block:8px;font-size:14px;font-weight:600;color:#1a1a1a;text-decoration:none;white-space:nowrap;transition:color .2s;}
#tadicore-landing-page .th-nav a:hover{color:var(--accent);}
#tadicore-landing-page .th-tools{display:flex;align-items:center;gap:16px;margin-inline-start:auto;}
#tadicore-landing-page .th-icon{appearance:none;background:none;border:0;padding:4px;display:grid;place-items:center;cursor:pointer;}
#tadicore-landing-page .th-icon img{display:block;}
#tadicore-landing-page .th-pill{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--accent);border-radius:50px;color:#00577c;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s;}
#tadicore-landing-page .th-pill:hover{background:var(--accent);color:#fff;}
#tadicore-landing-page .th-burger{display:none;appearance:none;background:none;border:0;padding:6px;color:#1a1a1a;cursor:pointer;}
#tadicore-landing-page .th-burger svg{width:26px;height:26px;display:block;}
@media (max-width:980px){
  #tadicore-landing-page .th-nav,
  #tadicore-landing-page .th-pill{display:none;}
  #tadicore-landing-page .th-burger{display:block;}
  #tadicore-landing-page .th-logo{order:0;}
}
#tadicore-landing-page .btn{--btn-bg:var(--brand);--btn-fg:#fff;--btn-border:transparent; display:inline-flex;align-items:center;justify-content:center;gap:10px; font-weight:700;font-size:16px;letter-spacing:-0.01em; padding:15px 30px;border-radius:var(--radius-pill); border:1.5px solid var(--btn-border);cursor:pointer;text-decoration:none; background:var(--btn-bg);color:var(--btn-fg); transition:background .18s ease,transform .18s ease,translate .3s var(--ease-out),box-shadow .18s ease,color .18s ease,border-color .18s ease; white-space:nowrap;position:relative;overflow:hidden;}
#tadicore-landing-page .btn .icon{width:18px;height:18px;transition:transform .35s var(--ease-out);}
#tadicore-landing-page .btn:hover .icon{transform:translateX(-5px);}
#tadicore-landing-page .btn-primary::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(120%);transition:transform .8s var(--ease-out);}
#tadicore-landing-page .btn-primary:hover::after{transform:translateX(-120%);}
#tadicore-landing-page .btn-lg{padding:17px 36px;font-size:17px;}
#tadicore-landing-page .btn-primary{box-shadow:0 16px 32px -16px rgba(0,113,161,.55);}
#tadicore-landing-page .btn-primary:hover{--btn-bg:#3d8ab0;transform:translateY(-2px);box-shadow:0 20px 38px -16px rgba(0,113,161,.65);}
#tadicore-landing-page .btn-primary:active{--btn-bg:#367696;transform:translateY(0);}
#tadicore-landing-page .btn-secondary{--btn-bg:transparent;--btn-fg:var(--text);--btn-border:var(--hairline-strong);}
#tadicore-landing-page .btn-secondary:hover{--btn-border:var(--accent);background:var(--accent-soft);color:var(--accent-strong);transform:translateY(-2px);}
#tadicore-landing-page .btn:focus-visible{outline:2px solid var(--blue-500);outline-offset:3px;}
#tadicore-landing-page .btn:active{transform:scale(.97);}
#tadicore-landing-page .hero{position:relative;overflow:clip;isolation:isolate; padding-top:56px;padding-bottom:104px; min-height:max(540px, calc(100svh - 72px - 200px));display:flex;align-items:center; background:#0a1114; color:#fff;}
#tadicore-landing-page .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:28% 42%; z-index:-2;scale:calc(1.12 + var(--hp,0) * .16);translate:0 calc(var(--py,0) * 1px);will-change:translate,scale; animation:tc-heroZoom 1.6s var(--ease-out) backwards;}
@keyframes tc-heroZoom{from{scale:1.24;}to{scale:1.12;}}
#tadicore-landing-page .hero-scrim{position:absolute;inset:0;z-index:-1; background: linear-gradient(100deg, rgba(5,9,11,.18) 10%, rgba(5,9,11,.62) 60%, rgba(5,9,11,.88) 100%);}
#tadicore-landing-page .hero{margin-bottom:-1px;}
#tadicore-landing-page .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:17%;z-index:-1;pointer-events:none; background:linear-gradient(to top,#f3f8fa 0%,rgba(243,248,250,.86) 5%,rgba(243,248,250,.55) 10%,rgba(243,248,250,.24) 15%,rgba(243,248,250,.08) 20%,rgba(243,248,250,0) 100%);}
#tadicore-landing-page .hero-inner{position:relative;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px;}
#tadicore-landing-page .hero-copy{max-width:640px;margin-inline-end:auto;}
#tadicore-landing-page .hero-copy h1{font-size:clamp(30px,3.8vw,48px);margin-block:0 20px;line-height:1.14;color:#fff;}
#tadicore-landing-page .hero-copy h1 .em{font-style:normal;color:var(--blue-300);}
#tadicore-landing-page .hero-copy p.lede{font-size:18px;color:rgba(255,255,255,.88);max-width:52ch;margin-bottom:32px;}
#tadicore-landing-page .hero-actions{display:flex;flex-wrap:wrap;gap:16px;}
#tadicore-landing-page .btn-on-photo.btn-secondary{--btn-fg:#fff;--btn-border:rgba(255,255,255,.4);}
#tadicore-landing-page .btn-on-photo.btn-secondary:hover{--btn-border:#fff;background:rgba(255,255,255,.1);color:#fff;}
#tadicore-landing-page .hero-stage{position:relative;height:420px;}
#tadicore-landing-page .hero-float{position:absolute;inset:0;animation:tc-heroFloat 7s ease-in-out infinite;}
@keyframes tc-heroFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
#tadicore-landing-page .hero-tilt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .5s var(--ease-out);transform-style:preserve-3d;}
#tadicore-landing-page .glow-orb{position:absolute;top:50%;left:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%; background:radial-gradient(circle,rgba(78,169,203,.45),transparent 68%); filter:blur(30px);animation:tc-orbPulse 5s ease-in-out infinite;pointer-events:none;}
@keyframes tc-orbPulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:.85;transform:scale(1.08);}}
#tadicore-landing-page .device-shot{position:relative;z-index:2;width:min(92%,420px);translate:-9% calc(-4% + var(--hp,0) * -18px); filter:drop-shadow(0 40px 60px rgba(0,0,0,.55)) drop-shadow(0 4px 14px rgba(78,169,203,.35));}
#tadicore-landing-page .phone-shot{position:absolute;z-index:3;width:150px;bottom:-52px;right:-5%;translate:0 calc(var(--hp,0) * -64px); filter:drop-shadow(0 30px 44px rgba(0,0,0,.5));}
#tadicore-landing-page .hero-hotspot{position:absolute;width:44px;height:44px;border-radius:50%;padding:0; background:rgba(10,17,20,.66);border:1.5px solid rgba(166,212,229,.75); display:grid;place-items:center;cursor:pointer;color:#fff; backdrop-filter:blur(6px);z-index:5;transition:background .25s,box-shadow .25s;}
#tadicore-landing-page .hero-hotspot:hover,
#tadicore-landing-page .hero-hotspot:focus-visible{background:rgba(33,148,190,.7);box-shadow:0 0 0 6px rgba(166,212,229,.18);}
#tadicore-landing-page .hero-hotspot::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(166,212,229,.45);animation:tc-hotspotPulse 2.4s ease-out infinite;pointer-events:none;}
@keyframes tc-hotspotPulse{0%{transform:scale(.7);opacity:.9;}100%{transform:scale(1.5);opacity:0;}}
#tadicore-landing-page .hero-hotspot .icon{width:20px;height:20px;}
#tadicore-landing-page .hero-hotspot .tip{direction:rtl; position:absolute;bottom:calc(100% + 16px);right:50%;transform:translateX(50%) translateY(6px); width:min(280px,78vw);background:#0d1a20;border:1px solid rgba(166,212,229,.35);border-radius:16px; padding:16px 18px;font-size:15px;color:rgba(255,255,255,.9);line-height:1.55;text-align:start; opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease-out);box-shadow:0 24px 48px -18px rgba(0,0,0,.6);}
#tadicore-landing-page .hero-hotspot .tip b{display:block;font-size:16.5px;color:#fff;margin-bottom:4px;}
#tadicore-landing-page .hero-hotspot:hover .tip,
#tadicore-landing-page .hero-hotspot:focus-visible .tip{opacity:1;transform:translateX(50%) translateY(0);pointer-events:auto;}
#tadicore-landing-page .hero-hotspot.h2 .tip{right:auto;left:0;transform:translateY(6px);}
#tadicore-landing-page .hero-hotspot.h2:hover .tip,
#tadicore-landing-page .hero-hotspot.h2:focus-visible .tip{transform:translateY(0);}
#tadicore-landing-page .hero-hotspot.h1{top:11%;right:14%;}
#tadicore-landing-page .hero-hotspot.h2{top:38%;left:2%;}
#tadicore-landing-page .hero-hotspot.h3{bottom:16%;right:64%;}
#tadicore-landing-page .trust{padding-block:34px;background:var(--bg);}
#tadicore-landing-page .trust .container{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
#tadicore-landing-page .trust-chip{display:flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 26px;border-radius:var(--radius-pill); background:var(--surface);border:1px solid var(--hairline);font-size:14.5px;font-weight:700;line-height:1; transition:transform .4s var(--ease-out),border-color .3s,box-shadow .3s;}
#tadicore-landing-page .trust-chip:hover{transform:translateY(-3px);border-color:rgba(33,148,190,.35);box-shadow:0 16px 30px -20px rgba(33,148,190,.35);}
#tadicore-landing-page .trust-chip .icon-wrap{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;transition:transform .5s var(--ease-out);}
#tadicore-landing-page .trust-chip:hover .icon-wrap{transform:rotate(-8deg) scale(1.1);}
#tadicore-landing-page .trust-chip .icon-wrap svg{width:20px;height:20px;}
#tadicore-landing-page .bento{display:grid;gap:20px;}
#tadicore-landing-page .bento-card{border-radius:var(--radius-lg);padding:32px;position:relative;overflow:clip; display:flex;flex-direction:column;}
#tadicore-landing-page .bento-card .icon-wrap{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong); display:grid;place-items:center;margin-bottom:20px;flex:none;}
#tadicore-landing-page .bento-card .icon-wrap svg{width:24px;height:24px;}
#tadicore-landing-page .bento-card h3,
#tadicore-landing-page .bento-card h4{margin-bottom:10px;}
#tadicore-landing-page .bento-card p{color:var(--text-soft);font-size:14.5px;line-height:1.6;}
#tadicore-landing-page .stats-bento{grid-template-columns:repeat(4,1fr);}
#tadicore-landing-page .stats-bento .bento-card:first-child{grid-column:span 2;grid-row:span 1;flex-direction:row;align-items:center;gap:24px;text-align:right;}
#tadicore-landing-page .stats-bento .bento-card:first-child .icon-wrap{margin-bottom:0;width:64px;height:64px;}
#tadicore-landing-page .stats-bento .bento-card:first-child .icon-wrap svg{width:30px;height:30px;}
#tadicore-landing-page .stat-body{flex:1;min-width:0;}
#tadicore-landing-page .stat-num{font-family:var(--font-mono);font-weight:600;font-size:clamp(48px,5.8vw,76px);line-height:1; color:var(--accent-strong);letter-spacing:-0.02em;font-variant-numeric:tabular-nums; display:flex;align-items:baseline;justify-content:flex-end;direction:ltr;gap:4px;transform-origin:100% 50%;}

@keyframes tc-statPop{0%{transform:scale(1);text-shadow:0 0 0 rgba(33,148,190,0);} 35%{transform:scale(1.13);text-shadow:0 0 30px rgba(33,148,190,.5);} 100%{transform:scale(1);text-shadow:0 0 0 rgba(33,148,190,0);}}
#tadicore-landing-page .stat-bar{height:5px;border-radius:99px;background:var(--accent-soft);margin-top:16px;overflow:hidden;}

#tadicore-landing-page .stat-card.is-counted .stat-bar i{width:100%;}
#tadicore-landing-page .stat-title{margin-top:14px;font-weight:700;font-size:16.5px;}
#tadicore-landing-page .stat-desc{margin-top:6px;font-size:14px;color:var(--text-soft);line-height:1.55;}
#tadicore-landing-page .tag{display:inline-flex;align-items:center;justify-content:center;min-height:28px;font-family:var(--font-mono);font-size:12px;font-weight:600;line-height:1;background:var(--bg-soft);border:1px solid var(--hairline);color:var(--text-soft);padding:0 10px;border-radius:8px;transition:background .3s,color .3s,border-color .3s;}
@media (max-width:980px){
  #tadicore-landing-page .stats-bento{grid-template-columns:1fr 1fr;}
  #tadicore-landing-page .stats-bento .bento-card:first-child{grid-column:span 2;}
}
@media (max-width:640px){
  #tadicore-landing-page .stats-bento{grid-template-columns:1fr;}
  #tadicore-landing-page .stats-bento .bento-card:first-child{grid-column:span 1;flex-direction:column;align-items:flex-start;text-align:right;}
